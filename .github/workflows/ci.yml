name: CI

on:
  push:
    branches: [ main, develop, 'stage-**' ]
  pull_request:
    branches: [ main, develop, 'stage-**' ]

jobs:
  build:
    name: Build & Validate
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgrespassword
          POSTGRES_DB: ci_dev_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql://postgres:postgrespassword@localhost:5432/ci_dev_db?schema=public
      DEV_DATABASE_URL: postgresql://postgres:postgrespassword@localhost:5432/ci_dev_db?schema=public
      JWT_SECRET: ci-only-jwt-secret-not-used-outside-ci-0123456789
      NODE_ENV: development

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Apply tracked Prisma migrations to CI database
        run: npx prisma migrate deploy

      - name: Seed CI development & operational data
        env:
          ALLOW_DEMO_RESET: "true"
        run: |
          npx prisma db seed
          npx tsx scripts/seed_demo_operational_data.ts

      - name: Validate Prisma schema and migration status
        run: |
          npx prisma validate
          npx prisma migrate status

      - name: Fail on drift between migrations and schema.prisma
        run: npx prisma migrate diff --from-config-datasource --to-schema prisma/schema.prisma --exit-code

      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high

      - name: Run TypeScript typecheck
        run: npm run typecheck

      - name: Run ESLint
        run: npm run lint

      - name: Run Next.js production build
        # The job runs with NODE_ENV=development for the seed scripts' safety guard;
        # next build must run as production (Next 16 fails to prerender otherwise).
        env:
          NODE_ENV: production
        run: npm run build

      - name: Build production container image
        run: docker build --target runner -t milk-reception:ci .
